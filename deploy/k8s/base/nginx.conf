map $http_x_forwarded_proto $external_proto {
  default $scheme;
  https https;
  http http;
}
# Deployment template for /xiaoan-platform/. Keep in sync with deployment.json and frontend/scripts/deployment.mjs.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 80;
  # Keep canonical redirects relative behind TLS termination / published ports.
  absolute_redirect off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  location = /xiaoan-platform { return 308 /xiaoan-platform/$is_args$args; }
  location / { return 404; }
  location /xiaoan-platform/ {
    try_files $uri $uri/ /xiaoan-platform/index.html;
  }
  location /xiaoan-platform/assets/ { try_files $uri =404; }
  # Public, versioned model assets must never fall back to the SPA HTML.
  location /xiaoan-platform/ocr-assets/ { try_files $uri =404; }
  # A 20 MiB file needs multipart header/boundary headroom. Other APIs retain 20m.
  location /xiaoan-platform/api/v2/admin/ai-models/ {
    client_max_body_size 21m;
    proxy_pass http://xiaoan-api:8080/api/v2/admin/ai-models/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Forwarded-Prefix /xiaoan-platform/;
  }
  location = /xiaoan-platform/api { return 308 /xiaoan-platform/api/$is_args$args; }
  location /xiaoan-platform/api/ {
    proxy_pass http://xiaoan-api:8080/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Forwarded-Prefix /xiaoan-platform/;
  }
  # Only stream requests go to the gateway; cancel/detail stay on the API pool.
  location ~ ^/xiaoan-platform/api/v2/runs/[^/]+/stream$ {
    rewrite ^/xiaoan-platform/(.*)$ /$1 break;
    proxy_pass http://xiaoan-stream:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Forwarded-Prefix /xiaoan-platform/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no always;
  }
  location /xiaoan-platform/ws {
    proxy_pass http://xiaoan-api:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Forwarded-Prefix /xiaoan-platform/;
    proxy_read_timeout 3600s;
  }
}
