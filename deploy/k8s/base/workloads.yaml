apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaoan-web
  labels: &id001
    app.kubernetes.io/part-of: xiaoan
    app.kubernetes.io/name: web
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-pull
      terminationGracePeriodSeconds: 30
      containers:
      - name: web
        image: xiaoan-web:REPLACE_RELEASE
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/conf.d
          readOnly: true
        readinessProbe:
          httpGet:
            path: /xiaoan-platform/
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /xiaoan-platform/
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: nginx
        configMap:
          name: xiaoan-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: xiaoan-web
spec:
  selector:
    app.kubernetes.io/part-of: xiaoan
    app.kubernetes.io/name: web
  ports:
  - name: http
    port: 80
    targetPort: http
