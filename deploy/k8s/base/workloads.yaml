apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaoan-api
  labels: &id001
    app.kubernetes.io/part-of: xiaoan
    app.kubernetes.io/name: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: xiaoan-backend:REPLACE_RELEASE
        imagePullPolicy: IfNotPresent
        command:
        - api
        envFrom:
        - configMapRef:
            name: xiaoan-config
        - secretRef:
            name: xiaoan-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: storage
          mountPath: /app/data/storage
        - name: tmp
          mountPath: /tmp
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: xiaoan-storage
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: xiaoan-api
spec:
  selector:
    app.kubernetes.io/part-of: xiaoan
    app.kubernetes.io/name: api
  ports:
  - name: http
    port: 8080
    targetPort: http
---
