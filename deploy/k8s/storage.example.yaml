# Operator applies separately after selecting a real RWX-capable StorageClass.
# Not included in kustomization: installing/upgrading the app must not manage data lifetime.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xiaoan-storage
  namespace: eboat-ai-ns
spec:
  accessModes: [ReadWriteMany]
  storageClassName: REPLACE_RWX_STORAGE_CLASS
  resources:
    requests:
      storage: 20Gi
