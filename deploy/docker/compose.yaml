# Run from repo root using -f deploy/docker/compose.yaml.
# Requires Compose >= 2.30 (raw env_file); external MySQL/Redis are not created.
name: xiaoan
x-backend: &backend
  image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable image tag}
  restart: unless-stopped
  env_file:
    - path: ${RUNTIME_ENV_FILE:?set absolute path to reviewed backend env file}
      format: raw
  environment:
    STUDIO_ENV: prod
    APP_ENV: production
    APP_BASE_PATH: /xiaoan-platform/
    STORAGE_DRIVER: localfs
    STORAGE_LOCAL_ROOT: /app/data/storage
  volumes:
    - ${STORAGE_PATH:?set absolute storage path}:/app/data/storage:z
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}
services:
  api:
    <<: *backend
    command: [api]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  stream:
    <<: *backend
    command: [stream]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker-aily:
    <<: *backend
    command: [worker, --provider=feishu_aily]
  worker-delivery:
    <<: *backend
    command: [worker, --provider=feishu_delivery]
  scheduler:
    <<: *backend
    command: [scheduler]
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to an immutable image tag}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
      stream: {condition: service_healthy}
    ports: ["443:443"]
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ${TLS_PATH:?set absolute TLS directory}:/etc/nginx/tls:ro,Z
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
