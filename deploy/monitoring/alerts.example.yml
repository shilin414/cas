# Global counts repeat across instances. Never sum queue/outbox/capacity gauges.
# Tune example thresholds to actual SLOs before deployment.
groups:
  - name: studio-role-health
    rules:
      - record: studio_role:sample_fresh
        expr: |
          (studio_role_sample_success == 1)
          and on (job, instance, role, provider)
          ((time() - studio_role_sample_last_success_timestamp_seconds)
            < on (job, instance, role, provider) studio_role_stale_after_seconds)
      - alert: StudioRoleEndpointDown
        expr: up{job=~"studio-(worker|delivery|scheduler)"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Role metrics endpoint unavailable on {{ $labels.instance }}'
          description: 'Check process and private listener routing; do not expose the listener publicly to fix scraping.'
      - alert: StudioRoleInstrumentationMissing
        expr: |
          (up{job=~"studio-(worker|delivery|scheduler)"} == 1)
          unless on (job, instance) studio_role_sample_success
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Endpoint responds but role monitoring series are missing'
      - alert: StudioRoleSampleFailedOrStale
        expr: |
          (studio_role_sample_success == 0)
          or
          ((time() - studio_role_sample_last_success_timestamp_seconds)
            >= on (job, instance, role, provider) studio_role_stale_after_seconds)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Role sampling failed or stalled on {{ $labels.instance }}'
          description: 'Business gauges retain the last good sample, not current zero. Inspect DB latency and sampling budget.'
      - alert: StudioRoleLoopFailedOrStalled
        expr: |
          (studio_role_loop_success == 0)
          or
          ((time() - studio_role_loop_last_success_timestamp_seconds)
            >= on (job, instance, role, provider) group_left studio_role_stale_after_seconds)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.role }} loop {{ $labels.loop }} failed or stalled'
          description: 'Progress requires successful real IO, including empty scans. HTTP liveness alone is insufficient.'
      - alert: StudioRoleQueueAging
        expr: |
          (studio_role_queue_oldest_wait_seconds > 120)
          and on (job, instance, role, provider) studio_role:sample_fresh
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Old queued work for {{ $labels.role }}/{{ $labels.provider }}'
          description: 'Includes deferred work; inspect configured backoff, capacity and consumer progress before intervention.'
      - alert: StudioRoleOutboxBacklog
        expr: |
          (studio_role_outbox_pending > 500)
          and on (job, instance, role, provider) studio_role:sample_fresh
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Pending outbox backlog persists'
          description: 'This is a global DB count repeated per instance, not a relay heartbeat. Do not sum it.'
      - alert: StudioProviderUncontrolledCapacity
        expr: |
          (studio_role_provider_capacity{kind="uncontrolled"} > 0)
          and on (job, instance, role, provider) studio_role:sample_fresh
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Uncontrolled provider work for {{ $labels.provider }}'
          description: 'Check lease ownership and parked submissions; monitoring must never trigger or retry provider work.'
