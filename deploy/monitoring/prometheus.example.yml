# Example only: each target must share a network namespace with Prometheus,
# or be replaced with an explicitly isolated private-network target.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.example.yml
scrape_configs:
  - job_name: studio-worker
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9091']
  - job_name: studio-delivery
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9092']
  - job_name: studio-scheduler
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9093']
