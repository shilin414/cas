# xiaoan-worker-delivery — execution worker consuming the feishu_delivery provider queue.
# No Service, no HTTP probe (same rationale as xiaoan-worker-aily).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaoan-worker-delivery-test
  namespace: test-ai-ns
  labels:
    app: xiaoan-worker-delivery-test
    app.kubernetes.io/part-of: xiaoan-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xiaoan-worker-delivery-test
  template:
    metadata:
      labels:
        app: xiaoan-worker-delivery-test
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: xiaoan-worker-delivery-test
          image: harbor.hengan.com:8086/eboat2/xiaoan-backend:REPLACE_WITH_IMAGE_TAG
          command: [worker, --provider=feishu_delivery]
          envFrom:
            - configMapRef:
                name: xiaoan-config-test
            - secretRef:
                name: xiaoan-secret-test
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: xiaoan-storage
              mountPath: /app/data/storage
      volumes:
        - name: xiaoan-storage
          nfs:
            server: 192.168.212.165
            path: /db/k8s-ai-nfs/xiaoan-platform-data-test
            readOnly: false
