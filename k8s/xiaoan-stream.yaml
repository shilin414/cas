# xiaoan-stream — SSE long-connection plane (GET /api/v2/runs/*/stream).
# Health endpoints live on the same :8081 server as SSE traffic (verified in
# backend-go/cmd/stream/main.go — full API router on StreamAddr).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaoan-stream
  namespace: eboat-ai-ns
  labels:
    app: xiaoan-stream
    app.kubernetes.io/part-of: xiaoan-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xiaoan-stream
  template:
    metadata:
      labels:
        app: xiaoan-stream
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: xiaoan-stream
          image: harbor.hengan.com:8086/eboat2/xiaoan-backend:REPLACE_WITH_IMAGE_TAG
          command: [stream]
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: xiaoan-config
            - secretRef:
                name: xiaoan-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: xiaoan-storage
              mountPath: /app/data/storage
      volumes:
        - name: xiaoan-storage
          nfs:
            server: 192.168.212.165
            path: /db/k8s-ai-nfs/xiaoan-platform-data-test
            readOnly: false
---
apiVersion: v1
kind: Service
metadata:
  name: xiaoan-stream
  namespace: eboat-ai-ns
  labels:
    app: xiaoan-stream
spec:
  selector:
    app: xiaoan-stream
  ports:
    - name: http
      port: 8081
      targetPort: 8081
