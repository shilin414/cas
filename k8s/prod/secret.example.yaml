# Template ONLY — copy to k8s/secret.yaml (git-ignored) and fill real values.
# kubectl apply -f k8s/secret.yaml
# NEVER commit the filled file.
apiVersion: v1
kind: Secret
metadata:
  name: xiaoan-secret
  namespace: eboat-ai-ns
  labels:
    app.kubernetes.io/part-of: xiaoan-platform
type: Opaque
stringData:
  # ── External MySQL ──
  DB_HOST: REPLACE_ME
  DB_USER: REPLACE_ME
  DB_PASSWORD: REPLACE_ME

  # ── External Redis ──
  REDIS_HOST: REPLACE_ME
  REDIS_PORT: "6379"
  REDIS_PASSWORD: REPLACE_ME

  # ── Feishu app credentials ──
  FEISHU_APP_ID: REPLACE_ME
  FEISHU_APP_SECRET: REPLACE_ME

  # AES-256-GCM key material: 32 random bytes base64 (openssl rand -base64 32).
  # Encrypts Feishu refresh tokens at rest — rotating it logs out all Feishu sessions.
  TOKEN_ENCRYPTION_KEY: REPLACE_ME

  # One-time local admin bootstrap; empty = feature disabled.
  ADMIN_BOOTSTRAP_PASSWORD: ""

  # ── IT服务台业务应用接口（internal/businessapps；仅 xiaoan-api 使用）──
  # EBOAT 源站：token 与条码/LDAP/OA 各接口路径由代码拼接
  BUSINESS_EBOAT_URL: https://eboat.hengan.com
  BUSINESS_EBOAT_AUTH: REPLACE_ME
  BUSINESS_EBOAT_USER: REPLACE_ME
  BUSINESS_EBOAT_PASSWORD: REPLACE_ME
  BUSINESS_EBOAT_TENANT: "000000"
  # FDL 物料查询（完整接口URL）
  BUSINESS_MATERIAL_URL: REPLACE_ME
  BUSINESS_MATERIAL_AUTH: REPLACE_ME
  # OA 解锁
  BUSINESS_OA_UNLOCK_URL: http://202.109.209.40:8888/JOB/e9Ustatus/ulemysta
  BUSINESS_OA_APP_ID: REPLACE_ME
  BUSINESS_OA_SECRET: REPLACE_ME
  # TPM 账号重置/解锁
  BUSINESS_TPM_URL: https://eboat.hengan.com/api/eboat-nstar/authorityCenter/weixin/tpmUserManang
  BUSINESS_TPM_USER: REPLACE_ME
  BUSINESS_TPM_PASSWORD: REPLACE_ME
  # 账号变更默认取飞书 feishu_user_id（自动）；ACCOUNT_MAP 仅例外覆盖，如 {"<users.id>":"<工号>"}
  BUSINESS_ACCOUNT_MAP: '{}'
  # 允许代办他人账号操作的平台用户 id（逗号分隔）
  BUSINESS_OPERATOR_IDS: ""
